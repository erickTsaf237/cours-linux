# Configuration de déploiement du site (Worker « cours-linux » avec fichiers statiques).
# Utilisée par : python publier.py https://linux.tneric.com --deployer
# Les routes (linux.tneric.com) sont gérées dans le tableau de bord Cloudflare et ne sont pas modifiées ici.
name = "cours-linux"
main = "worker.js"
compatibility_date = "2026-10-01"
preview_urls = false

[assets]
directory = "../publication"
binding = "ASSETS"
not_found_handling = "404-page"   # sert publication/404.html
html_handling = "none"            # garde les adresses …/module.html telles quelles (référencement)
# Sans cela, les navigations du navigateur (Sec-Fetch-Mode: navigate) vers « / » reçoivent
# directement la page 404 sans passer par worker.js.
run_worker_first = true
